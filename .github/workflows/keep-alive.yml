name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 12 */2 * *"   # cada 2 días, 7am Panamá
  workflow_dispatch:          # botón para probar a mano

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base
        run: |
          curl -sf --retry 3 --max-time 30 \
            "${{ secrets.SUPABASE_URL }}/rest/v1/keep_alive?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}"
